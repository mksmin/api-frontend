<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark" style="font-size: 16px;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover">
  {% block extra_meta %}{% endblock %}
  <title>{% block title %} Мой сайт {% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/style/style.css?v=1.0.8">


  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
          crossorigin="anonymous"></script>
  {% block extra_scripts %}
    <script src="https://telegram.org/js/telegram-widget.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  {% endblock %}
  {% block head_extra %}{% endblock %}
</head>
<body>
{% block navbar %}{% endblock %}
<main>
  <div class="main-container-wrap">
    {% block content %}
    {% endblock %}
  </div>
</main>
<footer>
  {% block scripts %}{% endblock %}
  <script defer>
    document.addEventListener('DOMContentLoaded', function() {
      const tg = window.Telegram?.WebApp;
      const photoUrl = tg?.initDataUnsafe.user?.photo_url || '';
      if (photoUrl) {
        sessionStorage.removeItem('photoUrl');
        sessionStorage.setItem('photoUrl', photoUrl);
      }

      const url = sessionStorage.getItem('photoUrl');
      if (url) {
        const img = document.getElementById('userAvatar');
        if (img) {
          img.src = url;
        }
      }
    });

    const logoutButton = document.getElementById('logout_button');
    logoutButton?.addEventListener(
      'click', async() =>
    {
      try {
        const response = await fetch(
          {{ url_for("user:logout").path | tojson }},
          {
            method: 'POST',
            body: new URLSearchParams(
              {
                token_key: {{ csrf_token | default('') | tojson }},
              },
            ),
          },
        );

        if (!response.ok || !response.redirected) {
          throw new Error(`Logout failed (${response.status})`);
        }
        window.location.replace(response.url);
      } catch (e) {
        window.alert('Не удалось выйти. Обнови страницу и попробуй снова.');
      }
    }
    )


  </script>

</footer>
</body>
</html>
