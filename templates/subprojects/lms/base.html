<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% block title %}
      LMS
    {% endblock %}
  </title>
  <script>
    const savedTheme = localStorage.getItem('lms-theme');

    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.documentElement.dataset.bsTheme = savedTheme;
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.css"
  >

  {% block extra_head %} {% endblock %}
</head>
<body>
{% block navbar %}
  {% include "subprojects/lms/components/navbar.html" %}
{% endblock %}


<main id="main-content"
      class="
{% block main_class %}container-fluid xl:container{% endblock %} py-4 md:py-5">
  {% block content %} {% endblock %}
</main>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

{% block scripts %} {% endblock %}
<script>
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const root = document.documentElement;

    const currentTheme = root.dataset.bsTheme
      || (window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light');

    const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

    root.dataset.bsTheme = nextTheme;
    localStorage.setItem('lms-theme', nextTheme);
  });
</script>
</body>
</html>
