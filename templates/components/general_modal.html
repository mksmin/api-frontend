{% if legacy_modal %}
<div class="modal fade" id="general-page-modal" tabindex="-1" aria-labelledby="gModalText" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-custom">
{% else %}
<dialog class="dialog modal-custom" id="general-page-modal" aria-labelledby="gModalText">
{% endif %}
  <div class="{{ 'modal-body' if legacy_modal else 'dialog-body' }} text-center pb-3">
    <div class="row align-items-center text-start justify-content-between">
      <h4 id="gModalText" class="text-center">Some text</h4>
    </div>
  </div>
  <div class="d-grid gap-2 d-md-flex justify-content-md-center pt-1 pb-3 px-3">
    <button type="button" class="{{ 'btn btn-success' if legacy_modal else 'btn-solid theme-success' }} btn-c-lg"
            id="gModalConfirmButton" disabled>Confirm</button>
    <button type="button" class="{{ 'btn btn-secondary' if legacy_modal else 'btn-text theme-secondary' }} btn-c-lg"
            data-bs-dismiss="{{ 'modal' if legacy_modal else 'dialog' }}" id="gModalCancelButton">Cancel</button>
  </div>
{% if legacy_modal %}
    </div>
  </div>
</div>
{% else %}
</dialog>
{% endif %}
